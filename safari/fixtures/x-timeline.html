<!DOCTYPE html>
<!-- Smoke-test fixture: a few posts in mobile x.com's timeline markup
     (article[data-testid="tweet"] inside cellInnerDiv cells). Serve it locally
     and build the extension with XFP_EXTRA_MATCHES="http://localhost/*". -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fixture timeline</title>
  <style>
    body { margin: 0; background: #000; color: #e7e9ea; font: 15px/1.35 -apple-system, system-ui, sans-serif; }
    header { position: sticky; top: 0; padding: 12px 16px; background: rgba(0,0,0,.85); border-bottom: 1px solid #2f3336; font-weight: 700; }
    [data-testid="cellInnerDiv"] { border-bottom: 1px solid #2f3336; }
    article { display: flex; flex-direction: column; padding: 12px 16px; }
    .post { display: flex; gap: 10px; }
    .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #333; }
    [data-testid="User-Name"] { display: flex; gap: 4px; color: #71767b; }
    [data-testid="User-Name"] span:first-child { color: #e7e9ea; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 53px; padding-bottom: env(safe-area-inset-bottom); background: #000; border-top: 1px solid #2f3336; }
  </style>
</head>
<body>
  <header>Home (fixture)</header>
  <main data-testid="primaryColumn">
    <section role="region"><div id="timeline"></div></section>
  </main>
  <nav aria-label="Primary"></nav>
  <script>
    const posts = [
      ['Ada', 'ada', 'Grateful for this community. We shipped the accessibility fix together and the kindness in the reviews was wonderful.'],
      ['Rage Bot', 'ragebot', 'This is OUTRAGEOUS!!! These idiots want to DESTROY everything. Wake up, sheeple! Pick a side!!'],
      ['Grace', 'grace', 'TIL octopuses taste with their arms. Fascinating research on how curious creatures learn.'],
      ['Doom Feed', 'doomfeed', 'Disgusting, pathetic liars. Everyone knows they are the enemy. Total garbage, terrible and hopeless.'],
      ['Lin', 'lin', 'Proud of my friend who launched her first open-source project today. Congratulations!'],
      ['Ratio King', 'ratioking', 'Ratio + L + cope. You clowns are stupid and your takes are trash. Thoughts?'],
      ['Sam', 'sam', 'Calm morning walk, hopeful about the week. Hope yours is peaceful too.']
    ];
    const timeline = document.getElementById('timeline');
    posts.forEach(([name, handle, text], i) => {
      const id = String(1880000000000000000n + BigInt(i + 1));
      const cell = document.createElement('div');
      cell.setAttribute('data-testid', 'cellInnerDiv');
      cell.innerHTML = `
        <article data-testid="tweet" role="article" tabindex="0"><div class="post">
          <div class="avatar"></div>
          <div>
            <div data-testid="User-Name"><span>${name}</span> <a href="/${handle}" role="link">@${handle}</a>
              · <a href="/${handle}/status/${id}"><time datetime="2026-10-26T12:00:00Z">2h</time></a></div>
            <div data-testid="tweetText" lang="en">${text}</div>
          </div>
        </div></article>`;
      timeline.appendChild(cell);
    });
  </script>
</body>
</html>
